name: ci

on:
  push:
    branches: [main]
    paths:
      - "trajan/**"
      - "harness/**"
      - "tests/**"
      - "bin/**"
      - "pyproject.toml"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "trajan/**"
      - "harness/**"
      - "tests/**"
      - "bin/**"
      - "pyproject.toml"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: trajan

jobs:
  test:
    name: trajan / tests py${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: trajan/pyproject.toml

      # No secrets, no network calls to model providers: the suite must be green for
      # anyone who clones the repository. Tests import the package via `pythonpath`
      # from pyproject.toml, so no install step is required.
      #
      # mypy is here because the holdout bench runs a real project whose policy includes
      # a `mypy --strict` check: without it the bench would report a missing tool as a
      # failing check, and every case would come out HOLD.
      - name: Install test dependencies
        run: >
          python -m pip install --upgrade pip "pydantic>=2.7" "pytest>=8"
          "pytest-asyncio>=0.23" "httpx>=0.27" "mypy>=1.10"

      - name: Run tests
        run: python -m pytest

  lint:
    name: trajan / lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: trajan/pyproject.toml

      - name: Install linters
        run: python -m pip install --upgrade pip "ruff>=0.5" "mypy>=1.10" "pydantic>=2.7" "httpx>=0.27"

      - name: ruff
        run: python -m ruff check .

      - name: mypy
        run: python -m mypy

  harness:
    # The root half: a box per project. Standard library only, so the job installs nothing
    # but the tools that check it — no venv, no package, nothing to resolve.
    name: harness / tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the tools that check the harness
        run: python -m pip install --upgrade pip "pytest>=8" "ruff>=0.5" "mypy>=1.10"

      - name: ruff
        run: python -m ruff check harness tests bin

      - name: mypy
        run: python -m mypy

      - name: tests
        run: PYTHONPATH=. python -m pytest tests
