# The architecture of the harness itself: one package, one direction.
#
# The command line is the only thing that knows every contour; a contour knows the box and
# nothing else; the box knows the filesystem and nothing above it. A contour that imported
# another contour would make a box command depend on a neighbour's implementation.
#
# The reference executors are a layer of their own, above the contours, because the adapter
# for a model reuses Caesar's rule for what a declared path means: one dialect of globs, not
# two. They are programs the box declares, not code the command line calls directly.

schema_version = 1

[project]
root_packages = ["harness"]

[architecture]
baseline = """\
Fourteen modules in one package: a box, an orchestrator, a campaign above it, the box's
memory (the frame, the records digest, the context pack, the reader's profile), five contours
(Caesar, Trajan, Aurelius, the container, the executor), the reference executors and a command
line that glues them together.
"""
target = """\
The command line on top; the campaign above the orchestrator; the reference executors as
programs the box declares; the orchestrator above the records; the records above the contours;
the contours below, each seeing only the box; the box at the bottom, importing nothing from
the package. Adding a contour means adding a sibling, not editing the neighbours.
"""

[[layer]]
name = "the command a person types"
modules = ["harness.cli"]

[[layer]]
name = "reference executors: programs the box declares"
modules = ["harness.executors"]

[[layer]]
name = "the campaign: a plan above the orchestrator"
modules = ["harness.campaign"]

[[layer]]
name = "the orchestrator: one task through its contours"
modules = ["harness.augustus"]

[[layer]]
name = "the records: what the box remembers, and what a task is told"
modules = ["harness.frame", "harness.records", "harness.context", "harness.reviewer"]

[[layer]]
name = "the contours: a gate, verification, architecture, the container, the executor"
modules = [
    "harness.caesar",
    "harness.contour",
    "harness.aurelius",
    "harness.container",
    "harness.executor",
]
independent = true

[[layer]]
name = "the box: files, records, the project link"
modules = ["harness.box"]
