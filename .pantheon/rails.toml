schema_version = 1

[brief]
why = "Один человек с агентами не может проверять каждую строку: работа принимается по вердикту, который считает код, а не по отчёту модели."
for = "владелец проекта, который ставит задачи словами и не читает код"
success = "задача проходит путь от слов до вердикта и записи, и всё, что не проверено, названо"

[[goal]]
text = "поставить задачу словами и получить сделанное с вердиктом"

[[goal]]
text = "видеть, что именно проверено, а что осталось за скобками"

[[goal]]
text = "менять направление решением с названной ценой, а не по ходу дела"

[[milestone]]
id = "M0"
title = "Архитектура и решения"
closes_when = "D1–D10 подтверждены, документы и код не расходятся"
metric = "open"
state = "closed"

[[milestone]]
id = "M1"
title = "Коробка и сквозной срез"
closes_when = "задача проходит от слов до вердикта и acta одним прогоном"
metric = "verdicts"

[[milestone]]
id = "M2"
title = "Глубина"
closes_when = "прерванный прогон продолжается без повторного вопроса модели, а пробелы названы"
metric = "verdicts"

[[milestone]]
id = "M3"
title = "Эффективность"
closes_when = "простая задача закрывается не дольше обычной постановки агенту"
metric = "speed"

[[milestone]]
id = "M4"
title = "Сторонние репозитории"
closes_when = "чужой проект проходит тот же путь без правок под него"
metric = "verdicts"

[[milestone]]
id = "M5"
title = "Режимы и рельсы"
closes_when = "задача называет веху, у потока и цикла есть объекты, ревизия оставляет записку"
metric = "verdicts"

[[metric]]
name = "open"
direction = "down"
threshold = "0 открытых решений D"

[[metric]]
name = "verdicts"
direction = "up"
threshold = "каждая задача заканчивается вердиктом, посчитанным кодом"

[[metric]]
name = "speed"
direction = "down"
threshold = "не медленнее обычной постановки агенту"

[[metric]]
name = "cents"
direction = "down"
threshold = "не больше 5 центов за живой прогон"

[[principle]]
text = "Вердикт считает код, а не модель"
why = "модель, хвалящая свою работу, — не свидетель"

[[principle]]
text = "Отсутствие видно: что не проверено, названо"
why = "молчание читается как успех"

[[principle]]
text = "Ожидание до прогона"
why = "подогнанное после результата ожидание ничего не проверяет"

[[principle]]
text = "Направление меняется решением с ценой"
why = "иначе одна задача тянет вторую, и проект уезжает в сторону"
