# What qagent checks about itself.
#
# This file is project context (ADR-002): it lives in the repository, it is reviewed like
# code, and every check names a command the project already has. `qagent run` executes them
# in order with the budget below, keeps the output as evidence and never decides on its own
# that a skippable check is allowed to disappear.
#
# Commands are resolved on PATH, so run this from an environment where the project's own
# tools are available (here: the checkout's .venv/bin on PATH), the same assumption the
# Makefile makes with PYTHON=.venv/bin/python.

name = "qagent-default"

[budget]
max_seconds = 300
max_checks = 10

[[checks]]
id = "tests"
name = "test suite"
argv = ["python", "-m", "pytest", "-q"]
timeout_s = 180
requires = "pytest"
purpose = "a red suite means the change breaks something the project already promised"

[[checks]]
id = "lint"
name = "ruff"
argv = ["python", "-m", "ruff", "check", "."]
timeout_s = 60
requires = "ruff"
purpose = "cheap, deterministic, and it catches the class of mistake a reviewer should not spend a token on"

[[checks]]
id = "types"
name = "mypy --strict"
argv = ["python", "-m", "mypy"]
timeout_s = 180
requires = "mypy"
purpose = "the strict typing is part of the contract here, not a preference"
