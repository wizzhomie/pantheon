goal = "Автодополнение ломается на слове с «=»: при наборе `prog --color=a` предлагаются `auto` и `always` вместо `--color=auto` и `--color=always`, и опция затирается. Почини путь дополнения в src/click/shell_completion.py так, чтобы для незавершённого слова с «=» каждое предложенное значение несло часть до «=» включительно (и для пустого значения тоже), одинаково для bash и zsh; на словах без «=» поведение не меняется. Больше ничего не меняй."
