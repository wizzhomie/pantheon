# reproduction. c-d3 showed a green suite can pass a broken fix because no test covers the
# defect's input; here that input is a check, so the box must see it fail before the change
# and pass after it.
#
# Defect: pallets/click#2847, reproduced by hand: `_COMPLETE=bash_complete` on
# `prog --color=a` returns `auto`, `always`; the shell replaces the whole word and `--color=`
# disappears. The same Python path feeds bash and zsh.
#
# Prediction, recorded before the run: the box edits src/click/shell_completion.py, the
# reproduction goes from failing to passing, the 2 629-test suite stays green, verdict pass,
# about a quarter of a cent.
schema_version = 1
