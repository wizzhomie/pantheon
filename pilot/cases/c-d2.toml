# Case D2 — the same real defect as c-d1, asked in the shape the model can finish. c-d1 showed
# two things at once: the model writes the first half of a multi-site fix and then repeats
# itself until the answer cap, and the box never let the broken half through. Here the read
# scope is one file and the change lives there too, so there is no second file to lose track
# of and no answer budget spent on reading a test file.
#
# Defect: pallets/click#2847. Reproduced by hand at this commit: `_COMPLETE=bash_complete` on
# `prog --color=a` returns `auto`, `always`; the shell replaces the whole word and `--color=`
# disappears; the same Python path feeds zsh.
#
# Prediction, recorded before the run: the box changes src/click/shell_completion.py only,
# re-attaches the prefix before "=" to every completion, leaves the 2 629-test suite green,
# verdict pass, under a cent.
