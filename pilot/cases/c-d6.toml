self_check = ["python", "-c", '''import os
import click
from click.shell_completion import BashComplete

@click.command()
@click.option('--mode', type=click.Choice(['fast', 'slow']))
def main(mode):
    pass

def done(words):
    os.environ['COMP_WORDS'] = words
    os.environ['COMP_CWORD'] = '1'
    return BashComplete(main, {}, 'gobble', '_GOBBLE_COMPLETE').complete().splitlines()

got = done('gobble --mode=s')
assert got == ['plain,--mode=slow'], got
empty = done('gobble --mode=')
assert empty == ['plain,--mode=fast', 'plain,--mode=slow'], empty''']
repro = ["python", "-c", '''import os
import click
from click.shell_completion import BashComplete

@click.command()
@click.option('--color', type=click.Choice(['auto', 'always', 'never']))
def main(color):
    pass

def done(words):
    os.environ['COMP_WORDS'] = words
    os.environ['COMP_CWORD'] = '1'
    return BashComplete(main, {}, 'gobble', '_GOBBLE_COMPLETE').complete().splitlines()

got = done('gobble --color=a')
assert got == ['plain,--color=auto', 'plain,--color=always'], got
empty = done('gobble --color=')
assert empty == ['plain,--color=auto', 'plain,--color=always', 'plain,--color=never'], empty''']
