# Case D6 — two checks: one the model reads, one that judges. This is D36/ADR-035 on a live
# defect, and it answers the question c-d4..c-d5 left: a blind executor loses the place, a
# model that sees the acceptance test fits it. So the task shows the model a check over the
# same behaviour with different data, and judges with a check the model never sees.
#
# Defect: pallets/click#2847. Both checks run the real shell path — `BashComplete.complete()`,
# the text the shell prints — not a private method, so a fix that changes the completion for
# real passes both, and a fix fitted to the visible data (`--mode`) dies on the hidden one
# (`--color`).
#
# Prediction, recorded before the run: the model sees the visible check, its output format
# (`plain,--mode=slow`) and the entry point, and writes the prefix where `complete()` can see
# it; the hidden check passes, the 2 629-test suite stays green, verdict pass, about a third of
# a cent. The failure mode to watch is different from c-d4's: not «wrong place» but «fitted to
# `--mode`», which the hidden check would name.
