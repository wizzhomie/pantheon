goal = "Автодополнение ломается на слове с «=»: при наборе `prog --color=a` предлагаются `auto` и `always` вместо `--color=auto` и `--color=always`, и опция затирается; при `prog --color=` — `auto`, `always`, `never` без префикса. Сделай так, чтобы для незавершённого слова с «=» каждое предложенное значение несло часть до «=» включительно, включая пустой вариант, и одинаково для bash и zsh; на словах без «=» поведение не меняется. Добавь регрессионные тесты в tests/test_shell_completion.py, больше ничего не меняй."
