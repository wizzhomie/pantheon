# Что этот репозиторий обещает о себе.
#
# Написано 2026-11-25, когда репозиторий подключили к самому себе: только то, что уже
# записано решениями и проверяется кодом.

schema_version = 1

[architecture]
baseline = """\
Среда на стандартной библиотеке: коробка, оркестратор, кампании, раннер, записи и контуры;
рядом trajan как отдельный пакет со своими тестами и своим venv.
"""
target = """\
Командная строка сверху; раннер над кампанией; кампания над оркестратором; оркестратор над
записями; записи над контурами; контуры видят только коробку; коробка внизу и не импортирует
пакет. Trajan остаётся отдельным и не импортирует среду.
"""

[[requirements]]
id = "R1"
title = "Вердикт считает код, а не модель"
status = "approved"
detail = "Trajan выносит вердикт чистой функцией от прогона и находок; модель может предложить, но не выставить pass."
checks = ["gate"]

[[requirements]]
id = "R2"
title = "Проект не получает прав записи мимо ворот"
status = "approved"
detail = "Единственный писатель в коробке — Caesar; агент в контейнере предлагает диф, применяет его хост."
checks = ["gate"]
