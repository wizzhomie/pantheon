# What qagent checks about this demo project, and what it costs.
#
# The point of the demo is the verdict, not the check: the project's own test suite already
# fails, so `qagent verify` must say HOLD and point at the evidence instead of trusting a
# claim that "tests pass".

name = "verification-demo"

[budget]
max_seconds = 60
max_checks = 5

# Limits for every check in this demo. They are ceilings, not isolation, and the report of
# the demo run says exactly that — a demo is where a claim would be noticed.
[sandbox]
memory_mb = 1024
file_mb = 16

[[checks]]
id = "tests"
name = "test suite"
argv = ["python", "-m", "pytest", "-q"]
timeout_s = 60
requires = "pytest"
purpose = "the planted defect is caught by a test the project already had"

# A gate that only some changes need. It guards the migrations, so a run that reviews a
# change touching only `app.py` does not pay for it — and the report says why it did not run.
# A run with no change at all (the plain `make verify-demo`) plans it, because an unknown
# change may touch anything.
[[checks]]
id = "sql"
name = "migrations"
argv = ["python", "check_migrations.py"]
timeout_s = 30
when_paths = ["migrations/**"]
purpose = "a destructive migration must be marked by a human, not slipped in"
