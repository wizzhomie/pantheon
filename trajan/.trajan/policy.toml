# What trajan checks about itself.
#
# This file is project context (ADR-002): it lives in the repository, it is reviewed like
# code, and every check names a command the project already has. `trajan run` executes them
# in order with the budget below, keeps the output as evidence and never decides on its own
# that a skippable check is allowed to disappear.
#
# Commands are resolved on PATH, so run this from an environment where the project's own
# tools are available (here: the checkout's .venv/bin on PATH), the same assumption the
# Makefile makes with PYTHON=.venv/bin/python.

name = "trajan-default"

[budget]
max_seconds = 300
max_checks = 10

# Resource ceilings for every check. This is not isolation: a check can still reach the
# network and write anywhere the user can. It stops the class of accident that a report
# cannot explain after the fact — a check that eats the machine's memory or fills the disk.
# The suite and mypy fit in 1 GB of address space; 2 GB leaves room without pretending.
[sandbox]
memory_mb = 2048
file_mb = 64

[[checks]]
id = "tests"
name = "test suite"
argv = ["python", "-m", "pytest", "-q"]
timeout_s = 180
requires = "pytest"
purpose = "a red suite means the change breaks something the project already promised"

[[checks]]
id = "lint"
name = "ruff"
argv = ["python", "-m", "ruff", "check", "."]
timeout_s = 60
requires = "ruff"
purpose = "cheap, deterministic, and it catches the class of mistake a reviewer should not spend a token on"

[[checks]]
id = "types"
name = "mypy --strict"
argv = ["python", "-m", "mypy"]
timeout_s = 180
requires = "mypy"
purpose = "the strict typing is part of the contract here, not a preference"

# The net under the suite: a green run that got there by deleting the failing tests is not
# green. No `requires` on purpose — git and python are what trajan already runs on, and a
# `requires` naming a tool the profile does not know would turn the guard into a silent
# `not_applicable` (the profile knows pytest, ruff, mypy, not interpreters).
[[checks]]
id = "test-floor"
name = "test floor"
argv = ["python", "-m", "trajan.guards.floor", "--base", "HEAD"]
timeout_s = 30
purpose = "the suite may grow; the change may not take tests away to make it pass"
