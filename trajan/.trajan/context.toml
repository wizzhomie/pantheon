# Что этот проект обещает и какие обещания согласованы.
#
# Читается `trajan context`; утверждённые пункты уходят в контекст ревьюера. Только `approved`
# является обязательством (ADR-004): `proposed` — направление, а не гейт, `superseded` уже
# заменён другим пунктом. Файл ревьюится как код и стареет вместе с ним.

schema_version = 1

[architecture]
baseline = """\
Детерминированный движок проверок, находки, вердикт кодом и отчёт-пара; независимый ревьюер
по дифу с якорем. Ядро оценки остаётся измерительным прибором контура.
"""
target = """\
Оркестратор вокруг движка, архитектурные контракты и трассировка «требование → проверка →
находка → вердикт», эволюция проверок с ручным одобрением. Лимиты ресурсов для проверок — с
честной отметкой, что это потолки, а не изоляция. Знания о проекте живут в .trajan.
"""

[[requirements]]
id = "R1"
title = "Вердикт считает код, а не модель"
status = "approved"
detail = "Чистая функция от прогона и находок; модель может предложить, но не выставить PASS."
checks = ["tests"]

[[requirements]]
id = "R2"
title = "Проверки проекта запускаются без shell и без секретов родителя"
status = "approved"
detail = "argv-список, белый список окружения, таймаут с убийством группы процессов."
checks = ["tests"]

[[requirements]]
id = "R3"
title = "Публичные контракты строгие и неизменяемые"
status = "approved"
detail = "pydantic StrictModel: frozen, extra=forbid; новое поле — новое обещание."
checks = ["types"]

[[requirements]]
id = "R4"
title = "Документация не обещает того, чего нет"
status = "approved"
detail = "README перечисляет работающее и отдельно — что впереди. Проверки в политике нет."
checks = []

[[requirements]]
id = "R5"
title = "Ревьюер не может протащить находку без якоря"
status = "approved"
detail = "Файл из изменения, существующая строка, дословная цитата; иначе unverified."
checks = ["tests"]

[[requirements]]
id = "R6"
title = "Стиль и типы — часть контракта, а не пожелание"
status = "approved"
detail = "ruff и mypy --strict в политике; провал любого из них — провал обязательного гейта."
checks = ["lint", "types"]

[[invariants]]
id = "I1"
title = "Никакого shell=True и команд одной строкой"
status = "approved"
detail = "Проверяется тестами движка и ревьюера, а не линтером: это правило кода, не стиля."
checks = ["tests"]

[[invariants]]
id = "I2"
title = "Отчёт markdown — рендер json рядом с ним"
status = "approved"
detail = "Пара проверяется тестом: md обязан совпадать с рендером закоммиченного json."
checks = ["tests"]

[[invariants]]
id = "I3"
title = "Лимиты ресурсов — потолки, а не изоляция"
status = "approved"
detail = "«Песочница» здесь — memory_mb/file_mb из [sandbox]; отчёт говорит, что сеть и файловая система не изолированы, а платформа без лимитов не запускает проверку без них."
checks = ["tests"]

[[milestones]]
id = "M1"
title = "Профиль и контекст проекта в .trajan"
status = "approved"
detail = "Профиль, политика, требования, инварианты; команды inspect, run, verify, context."

[[milestones]]
id = "M2"
title = "Оркестратор: запрос → план → прогон → сохранение"
status = "proposed"

[[milestones]]
id = "M3"
title = "Трассировка: требование → доказательство → вердикт"
status = "proposed"

[[milestones]]
id = "M4"
title = "Holdout-бенч: контур сдаёт экзамен на наборе с известными ответами"
status = "approved"
detail = "examples/holdout: три подложенных дефекта, два чистых изменения и три кейса, которые видит только ревьюер; промах считается отдельно от ложной тревоги."
