[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
# The distribution is `pantheon-trajan` because `trajan` on PyPI belongs to an unrelated project; the
# import stays `trajan`, and the module lives in the Pantheon monorepo (design.md §13, ADR-010).
name = "pantheon-trajan"
dynamic = ["version"]
description = "Independent engineering verification: deterministic checks, an anchored LLM reviewer, and a verdict computed by code."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "wizzhomie" }]
keywords = ["verification", "code-review", "llm", "agents", "evaluation", "pydantic"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = ["pydantic>=2.7"]

[project.optional-dependencies]
openai = ["httpx>=0.27"]
anthropic = ["httpx>=0.27"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5", "mypy>=1.10", "httpx>=0.27"]

[project.urls]
Homepage = "https://github.com/wizzhomie/pantheon/tree/main/trajan"
Documentation = "https://github.com/wizzhomie/pantheon/tree/main/trajan/docs"
Issues = "https://github.com/wizzhomie/pantheon/issues"

[tool.hatch.version]
path = "src/trajan/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/trajan"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q --strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py311"
# The dev set plants defects on purpose — a mutable default is a case, not a mistake.
exclude = ["examples/devset"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
# The repo is bilingual: Russian docstrings and fixtures are deliberate, so
# "confusable character" warnings would be noise, not signal.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["trajan", "examples"]
# The evolve demo plants a type error on purpose, and the holdout suite is made of standalone
# projects with their own pytest and mypy config: checking them with the repository's rules
# would make trajan fail on its own fixtures. They are checked by `trajan verify` instead.
exclude = ["^examples/devset/", "^examples/evolve_demo/", "^examples/holdout/"]
