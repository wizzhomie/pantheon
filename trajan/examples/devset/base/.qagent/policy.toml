# What the dev-set project promises, and what it costs to check.
#
# The same three checks as the holdout project, on purpose: a case measures the contour, so
# the tools around it should not be the difference between the two suites.

name = "devset"

[budget]
max_seconds = 120
max_checks = 5

[sandbox]
memory_mb = 1024
file_mb = 16

[[checks]]
id = "tests"
name = "test suite"
argv = ["python", "-m", "pytest", "-q"]
timeout_s = 60
purpose = "a defect the project's own suite can see never reaches a human"

[[checks]]
id = "types"
name = "mypy --strict"
argv = ["python", "-m", "mypy", "--explicit-package-bases", "."]
timeout_s = 60
purpose = "a wrong annotation is a claim the code does not keep"

[[checks]]
id = "sql"
name = "migrations"
argv = ["python", "check_migrations.py"]
timeout_s = 30
when_paths = ["migrations/**"]
purpose = "a destructive migration must be marked by a human"
