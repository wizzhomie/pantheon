[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "agentqa"
dynamic = ["version"]
description = "Embedded QA for LLM agents: deterministic checks, LLM judge, bounded self-correction and offline regression."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "wizzhomie" }]
keywords = ["llm", "evaluation", "guardrails", "agents", "qa", "pydantic"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = ["pydantic>=2.7"]

[project.optional-dependencies]
openai = ["httpx>=0.27"]
anthropic = ["httpx>=0.27"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5", "mypy>=1.10", "httpx>=0.27"]

[project.urls]
Homepage = "https://github.com/wizzhomie/agentqa"
Documentation = "https://github.com/wizzhomie/agentqa/tree/main/docs"
Issues = "https://github.com/wizzhomie/agentqa/issues"

[tool.hatch.version]
path = "src/agentqa/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/agentqa"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q --strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
# The repo is bilingual: Russian docstrings and fixtures are deliberate, so
# "confusable character" warnings would be noise, not signal.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["agentqa", "examples"]
